<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512" class="cl-logo cl-working"><style>
.cl-logo{--cl-weft:#2dd4bf;--cl-warp:#7388f5;--cl-lit:#a7f3e6;overflow:visible}
.cl-weft path{stroke:var(--cl-weft)}.cl-weft circle{fill:var(--cl-weft)}
.cl-warp path{stroke:var(--cl-warp)}.cl-warp circle{fill:var(--cl-warp)}
.cl-ring,.cl-orbit,.cl-warp,.cl-pupil{transform-box:fill-box;transform-origin:center}
.cl-orbit{fill:none;stroke:var(--cl-lit);stroke-linecap:round;opacity:.9}
@media (prefers-reduced-motion:no-preference){
.cl-ring{animation:b 1.2s ease-in-out infinite}
.cl-weft path{animation:s 1.2s ease-in-out infinite;animation-delay:calc(var(--cl-i)*.2s)}
.cl-warp{animation:h 1.6s ease-in-out infinite}.cl-warp-1{animation-direction:reverse}
.cl-orbit{animation:o 1.1s linear infinite}
.cl-pupil{animation:p 5s ease-in-out infinite}
@keyframes b{0%,100%{scale:1}50%{scale:1.1}}
@keyframes s{0%,70%,100%{stroke:var(--cl-weft)}35%{stroke:var(--cl-lit)}}
@keyframes h{0%,100%{translate:0 0}50%{translate:0 -7px}}
@keyframes o{to{rotate:360deg}}
@keyframes p{0%,100%{translate:0 0}30%{translate:-6px 3px}65%{translate:4px -5px}}
}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs><rect width="512" height="512" rx="116" fill="#0b0f14"/><g class="cl-warp cl-warp-0" style="--cl-i:0"><path d="M176 128V230" fill="none" stroke="#7388f5" stroke-width="34"/><path d="M176 282V384" fill="none" stroke="#7388f5" stroke-width="34"/><circle cx="176" cy="128" r="17" fill="#7388f5"/><circle cx="176" cy="384" r="17" fill="#7388f5"/></g><g class="cl-warp cl-warp-1" style="--cl-i:1"><path d="M256 128V150" fill="none" stroke="#7388f5" stroke-width="34"/><path d="M256 202V310" fill="none" stroke="#7388f5" stroke-width="34"/><path d="M256 362V384" fill="none" stroke="#7388f5" stroke-width="34"/><circle cx="256" cy="128" r="17" fill="#7388f5"/><circle cx="256" cy="384" r="17" fill="#7388f5"/></g><g class="cl-warp cl-warp-2" style="--cl-i:2"><path d="M336 128V230" fill="none" stroke="#7388f5" stroke-width="34"/><path d="M336 282V384" fill="none" stroke="#7388f5" stroke-width="34"/><circle cx="336" cy="128" r="17" fill="#7388f5"/><circle cx="336" cy="384" r="17" fill="#7388f5"/></g><g class="cl-weft cl-weft-0" style="--cl-i:0"><path d="M128 176H150" fill="none" stroke="#2dd4bf" stroke-width="34"/><path d="M202 176H310" fill="none" stroke="#2dd4bf" stroke-width="34"/><path d="M362 176H384" fill="none" stroke="#2dd4bf" stroke-width="34"/><circle cx="128" cy="176" r="17" fill="#2dd4bf"/><circle cx="384" cy="176" r="17" fill="#2dd4bf"/></g><g class="cl-weft cl-weft-1" style="--cl-i:1"><path d="M128 256H230" fill="none" stroke="#2dd4bf" stroke-width="34"/><path d="M282 256H352" fill="none" stroke="#2dd4bf" stroke-width="34"/><circle cx="128" cy="256" r="17" fill="#2dd4bf"/><circle cx="352" cy="256" r="17" fill="#2dd4bf"/></g><g class="cl-weft cl-weft-2" style="--cl-i:2"><path d="M128 336H150" fill="none" stroke="#2dd4bf" stroke-width="34"/><path d="M202 336H310" fill="none" stroke="#2dd4bf" stroke-width="34"/><path d="M362 336H384" fill="none" stroke="#2dd4bf" stroke-width="34"/><circle cx="128" cy="336" r="17" fill="#2dd4bf"/><circle cx="384" cy="336" r="17" fill="#2dd4bf"/></g><circle class="cl-ring" cx="404" cy="256" r="30" fill="none" stroke="url(#g)" stroke-width="16"/><circle class="cl-orbit" cx="404" cy="256" r="48" stroke-width="5.333333333333333" stroke-dasharray="38 120"/><circle class="cl-pupil" cx="404" cy="256" r="8" fill="url(#g)"/></svg>
